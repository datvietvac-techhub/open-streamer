# Builds the reproducible cgo + FFmpeg 8 builder image (Dockerfile.builder)
# and pushes it to the GitHub Container Registry (GHCR).
#
# Why this exists: the native transcoder is cgo (go-astiav → libav 8), and
# FFmpeg 8 is not in any GitHub runner's apt. So CI and Release compile the
# cgo packages INSIDE this image via `container:` / a build-arg. The image
# rarely changes, so most CI runs just PULL it (seconds) instead of
# recompiling FFmpeg from source (~5 min).
#
# Runs when Dockerfile.builder (or this workflow) changes, or manually from
# the Actions tab. Publishes ghcr.io/<owner>/open-streamer-builder:{v1,latest}.
name: Builder image

on:
  workflow_dispatch:
  push:
    branches: [main, native-transcoder]
    paths:
      - Dockerfile.builder
      - .github/workflows/builder-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push builder → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builder
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/open-streamer-builder:v1
            ghcr.io/${{ github.repository_owner }}/open-streamer-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
